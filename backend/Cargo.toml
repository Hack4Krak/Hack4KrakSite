[package]
name = "hack4krak-backend"
version.workspace = true
edition.workspace = true

[features]
full-test-suite = []

[workspace]
members = [".", "macros", "migration", "openapi-cli"]

[workspace.package]
version = "2.2.0"
edition = "2024"

[workspace.dependencies]
sea-orm = { version = "2.0.2", features = [ "sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls", "macros", "mock" ] }
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "fs"] }
serde_norway = "0.9.42"

[dependencies]
# Generating OpenAPI
utoipa = { version = "5.5.0", features = ["actix_extras", "macros", "chrono", "uuid"] }
utoipa-actix-web = "0.1.2"
utoipa-scalar = { version = "0.3.0", features = ["actix-web"] }

# Custom crates
migration = { path = "migration" }
hack4krak-macros = { path = "macros" }

# Web
actix-web = { version = "4.15.0", features = ["cookies"] }
actix-web-validation = { version = "0.8.0", features = ["validator"] }
actix-cors = "0.7.2"
actix-governor = "0.10.0"
actix-files = "0.7.0"
actix-http = "3.13.5"

# Serde
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway.workspace = true

# Workspace
sea-orm.workspace = true
tokio.workspace = true

# Utils
regex = "1.13.1"
futures-util = "0.3.34"
reqwest = { version = "0.13.4", features = ["json"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }
envy = "0.4.2"
dotenvy = "0.15.7"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
argon2 = { version =  "0.6.0", features = ["password-hash"] }
jsonwebtoken = {  version = "11.0.0", features = ["rust_crypto"] }
chrono = "0.4.45"
oauth2 = { version = "5.0.0", features = ["reqwest"] }
lettre = "0.11.23"
dashmap = "6.2.1"
validator = { version = "0.21.0", features = ["derive"] }
sha2 = "0.11.0"
url = "2.5.8"
async-stream = "0.3.6"
rand = "0.10.2"
prometheus = "0.14.0"
askama = "0.16.1"
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
quoted_printable = "0.5.2"
testcontainers = "0.28.0"
mockall = "0.15.0"
